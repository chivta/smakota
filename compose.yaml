x-calbot: &calbot
  image: ghcr.io/arvlas/calbot:e39ea9306ef8d52cd5cfd377aa1e9888b39046cb
  build:
    context: .
    target: production
  env_file:
    - .env
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g,uid=65532,gid=65532,mode=1777
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  api:
    <<: *calbot
    command: ["api"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/calbot", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Long polling allows one consumer per token, so this stays at one replica.
  bot:
    <<: *calbot
    command: ["bot"]
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *calbot
    command: ["scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    user: postgres
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-calbot.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "calbot", "-d", "calbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    user: redis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
