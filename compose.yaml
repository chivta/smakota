# Local development only. Production runs on Kubernetes (manifests not written yet).
x-calbot: &calbot
  build:
    context: .
    target: dev
  env_file:
    - .env
  environment:
    # Writable cache locations survive rebuilds in named volumes.
    GOCACHE: /go-cache/build
    GOMODCACHE: /go-cache/mod
  volumes:
    - .:/app:ro
    - go_cache:/go-cache
  restart: unless-stopped

services:
  api:
    <<: *calbot
    command:
      - air
      - --build.cmd
      - go build -buildvcs=false -o /tmp/air/calbot ./cmd/calbot
      - --build.entrypoint
      - /tmp/air/calbot
      - --tmp_dir
      - /tmp/air
      - --
      - api
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/tmp/air/calbot", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start compiles before it can serve.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    <<: *calbot
    command:
      - air
      - --build.cmd
      - go build -buildvcs=false -o /tmp/air/calbot ./cmd/calbot
      - --build.entrypoint
      - /tmp/air/calbot
      - --tmp_dir
      - /tmp/air
      - --
      - scheduler
    depends_on:
      postgres:
        condition: service_healthy

  # One-off commands: migrate, seed, ingest, user, token.
  # Not started by `up`; run it with `docker compose run --rm cli <args>`.
  cli:
    <<: *calbot
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["go", "run", "-buildvcs=false", "./cmd/calbot"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-calbot.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "calbot", "-d", "calbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  go_cache:
