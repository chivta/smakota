apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        # Migrations are idempotent; running them first means a rollout always
        # lands on a migrated database.
        - name: migrate
          image: ghcr.io/chivta/smakota:placeholder
          args: [migrate]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: PUBLIC_URL
              value: https://api.smakota.chivtar.dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: api
          image: ghcr.io/chivta/smakota:placeholder
          args: [api]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: PUBLIC_URL
              value: https://api.smakota.chivtar.dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
