apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -off-full
patches:
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: ingest
      spec:
        schedule: "0 5 * * 0"
        jobTemplate:
          spec:
            activeDeadlineSeconds: 23400
            template:
              spec:
                containers:
                  - name: ingest
                    args: [ingest, off-full]
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        memory: 2Gi
