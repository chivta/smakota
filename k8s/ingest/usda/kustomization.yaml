apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
nameSuffix: -usda
patches:
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: ingest
      spec:
        schedule: "0 5 * * 4"
        jobTemplate:
          spec:
            activeDeadlineSeconds: 9000
            template:
              spec:
                containers:
                  - name: ingest
                    args: [ingest, usda]
