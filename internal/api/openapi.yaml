openapi: 3.0.3
info:
  title: calbot API
  version: "1.0"
  license:
    name: Proprietary
  description: |
    Backend for the Ukrainian calorie-logging bot. It holds no client-specific
    logic: every client is just a holder of a bearer token.

    There is no signup. An operator creates a user with `calbot user create`,
    then issues that user a token with `calbot token issue <user-id>`, which
    prints it once; only its hash is stored. `calbot token revoke <token-id>`
    disables it.

    Errors carry a machine-readable `code` and never a human message. Clients
    map a code to text in their own translation map.
servers:
  - url: http://localhost
    description: Local compose stack, through Caddy
  - url: http://localhost:8080
    description: The api service directly

tags:
  - name: user
    description: The current user, targets and timezone.
  - name: food
    description: The catalogue, and resolving free-form input against it.
  - name: day
    description: Logged entries.
  - name: ops
    description: Probes and metrics. These need no credentials.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A per-user API token, sent as `Authorization: Bearer <token>`. The token
        identifies the user; nothing else in the request can change who the call
        acts for.

  responses:
    BadRequest:
      description: Validation failed at the boundary
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DayLocked:
      description: The day is older than the 7-day editable window
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum: [NOT_FOUND, INVALID_INPUT, UNAUTHORIZED, FORBIDDEN, CONFLICT,
                 RATE_LIMITED, DAY_LOCKED, NOT_EXPORTABLE, INTERNAL]
      required: [code]

    Nutrition:
      type: object
      description: Always per 100 g on a Food, and absolute on a LogEntry.
      properties:
        kcal: { type: number }
        protein: { type: number }
        fat: { type: number }
        carbs: { type: number }

    Portion:
      type: object
      description: A named amount the user can pick instead of typing grams.
      properties:
        name: { type: string, example: "тарілка" }
        grams: { type: number, example: 350 }
        is_default: { type: boolean }

    Food:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [product, dish]
          description: Packaged branded goods versus home dishes and raw ingredients.
        name: { type: string, example: "Куряче філе, варене" }
        brand: { type: string }
        barcode: { type: string }
        state:
          type: string
          enum: [raw, cooked, as_sold]
          description: Which preparation the values describe. Shown in the UI.
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        package_g: { type: number, nullable: true }
        source_id: { type: string, example: "curated" }
        source_url: { type: string }
        portions:
          type: array
          items: { $ref: '#/components/schemas/Portion' }

    Candidate:
      type: object
      properties:
        food: { $ref: '#/components/schemas/Food' }
        score:
          type: number
          description: Trigram similarity, 0 to 1.
        bonus:
          type: number
          description: |
            History affinity added to the score when ranking, 0 to 0.25. Zero
            for foods the caller has never logged.

    Quantity:
      type: object
      description: An amount found in the phrase itself, which skips the portion step.
      properties:
        grams: { type: number }
        count: { type: number }
        portion: { type: string }

    ResolveResult:
      type: object
      properties:
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        confidence:
          type: string
          enum: [none, low, high]
          description: |
            `high` means one candidate is clearly ahead, so the client shows a
            single result with the portion pre-filled. `low` means show up to
            five. `none` means nothing cleared the floor.

    LogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        food_id:
          type: integer
          format: int64
          nullable: true
          description: Null for an inline entry, which has no catalogue row.
        food_name: { type: string }
        grams: { type: number }
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        logged_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogueEntryRequest:
      type: object
      required: [food_id]
      properties:
        food_id: { type: integer, format: int64 }
        grams: { type: number, maximum: 5000 }
        portion_name: { type: string, example: "тарілка" }
        portion_qty: { type: number, maximum: 50 }
        logged_at: { type: string, format: date-time, description: When the food was eaten. Defaults to now. }

    InlineEntryRequest:
      type: object
      required: [name, grams, nutrition]
      properties:
        name: { type: string, maxLength: 200, example: "мамина запіканка" }
        grams: { type: number, maximum: 5000 }
        nutrition:
          type: object
          description: Absolute values for the given grams. Macros default to zero.
          required: [kcal]
          properties:
            kcal: { type: number, minimum: 0 }
            protein: { type: number, minimum: 0 }
            fat: { type: number, minimum: 0 }
            carbs: { type: number, minimum: 0 }
        logged_at: { type: string, format: date-time, description: When the food was eaten. Defaults to now. }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sex: { type: string, enum: [male, female] }
        age: { type: integer }
        height_cm: { type: integer }
        weight_kg: { type: number }
        goal_weight_kg: { type: number }
        activity_level:
          type: string
          enum: [sedentary, light, moderate, high, very_high]
        kcal_target: { type: integer }
        protein_target_g: { type: integer }
        timezone: { type: string }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: healthCheck
      security: []
      responses:
        "204": { description: Serving }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text format
          content:
            text/plain: {}

  /v1/me:
    get:
      tags: [user]
      summary: Current user
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [user]
      summary: Update targets and weight
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kcal_target: { type: integer, minimum: 800, maximum: 6000 }
                protein_target_g: { type: integer, minimum: 20, maximum: 400 }
                weight_kg: { type: number, minimum: 30, maximum: 300 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/resolve:
    post:
      tags: [food]
      summary: Resolve free-form input to ranked candidates
      operationId: resolveInput
      description: |
        The single pipeline every input mode converges on. A quantity found in
        the phrase is returned so the client can skip the portion step. The call
        has no side effects, and input that matches nothing returns an empty
        `candidates` array with `confidence: none`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, input_type]
              properties:
                input: { type: string, maxLength: 500, example: "варена курка 150г" }
                input_type:
                  type: string
                  enum: [text, voice, photo, barcode, recent]
                clarification:
                  type: string
                  maxLength: 500
                  description: Added after the user taps "не те", alongside the original input.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResult' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/foods/{id}:
    get:
      tags: [food]
      summary: One catalogue entry
      operationId: getFood
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/barcode/{code}:
    get:
      tags: [food]
      summary: Look up a product by barcode
      operationId: getFoodByBarcode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: "04820001316384" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/foods/personal:
    post:
      tags: [food]
      summary: Create a personal entry
      operationId: createPersonalFood
      description: |
        The escape hatch after two failed refinements. The entry belongs to this
        user and outranks the catalogue for them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kcal]
              properties:
                name: { type: string, maxLength: 200 }
                kcal: { type: number, maximum: 900 }
                protein: { type: number, maximum: 100 }
                fat: { type: number, maximum: 100 }
                carbs: { type: number, maximum: 100 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/entries:
    get:
      tags: [day]
      summary: List logged entries
      operationId: listEntries
      description: |
        A flat array ordered by `logged_at` descending, filtered on `logged_at`. No totals or targets are
        computed; callers sum what they need.
      parameters:
        - name: from
          in: query
          description: |
            Start of the range, inclusive. A full RFC3339 timestamp, or a bare
            date meaning that day's midnight in UTC. Defaults to today (UTC).
          schema: { type: string }
        - name: to
          in: query
          description: |
            End of the range, inclusive. A full RFC3339 timestamp, or a bare
            date meaning the end of that UTC day. Defaults to today (UTC).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogEntry' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [day]
      summary: Log a food
      operationId: createEntry
      description: |
        Logging never requires a lookup. Send either a catalogue `food_id`
        with grams or a count of a named portion, or an inline `name` with
        `grams` and `nutrition`, which creates no catalogue row. Exactly one of
        `food_id` and `name` is required. Nutrition is snapshotted at save
        time, so a later catalogue correction never rewrites a day already
        logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CatalogueEntryRequest'
                - $ref: '#/components/schemas/InlineEntryRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogEntry' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/entries/{id}:
    patch:
      tags: [day]
      summary: Change an entry's amount
      operationId: updateEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grams]
              properties:
                grams: { type: number, maximum: 5000 }
      responses:
        "204": { description: Updated }
        "409": { $ref: '#/components/responses/DayLocked' }
    delete:
      tags: [day]
      summary: Delete an entry
      operationId: deleteEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: '#/components/responses/DayLocked' }
