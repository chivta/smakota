openapi: 3.0.3
info:
  title: calbot API
  version: "1.0"
  license:
    name: Proprietary
  description: |
    Backend for the Ukrainian calorie-logging bot. It holds no client-specific
    logic: every client is just a holder of a bearer token.

    A client creates an account with `POST /v1/auth/register` or signs in with
    `POST /v1/auth/login`; both return a token, shown once, of which only the
    hash is stored. `POST /v1/auth/logout` revokes the token it was called
    with. An operator can still create a credential-less user with
    `calbot user create` and issue it a token with `calbot token issue
    <user-id>`; `calbot token revoke <token-id>` disables one.

    Errors carry a machine-readable `code` and never a human message. Clients
    map a code to text in their own translation map.
servers:
  # Relative, so the docs page calls whatever host and port it was served from.
  # A fixed localhost URL breaks as soon as the published port is not 80.
  - url: /
    description: This server

tags:
  - name: auth
    description: Creating an account and getting or revoking a token.
  - name: user
    description: The current user, targets and timezone.
  - name: food
    description: The catalogue, and searching it.
  - name: day
    description: Logged entries.
  - name: mcp
    description: Model Context Protocol endpoint for AI agents.
  - name: ops
    description: Probes and metrics. These need no credentials.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A per-user API token, sent as `Authorization: Bearer <token>`. The token
        identifies the user; nothing else in the request can change who the call
        acts for.

  responses:
    BadRequest:
      description: Validation failed at the boundary
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many register or login calls from this client IP
      headers:
        Retry-After:
          description: Seconds until a call is accepted again
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DayLocked:
      description: The day is older than the 7-day editable window
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum: [NOT_FOUND, INVALID_INPUT, UNAUTHORIZED, FORBIDDEN, CONFLICT,
                 RATE_LIMITED, DAY_LOCKED, NOT_EXPORTABLE, INTERNAL]
      required: [code]

    Nutrition:
      type: object
      description: Always per 100 g on a Food, and absolute on a LogEntry.
      properties:
        kcal: { type: number }
        protein: { type: number }
        fat: { type: number }
        carbs: { type: number }

    Portion:
      type: object
      description: A named amount the user can pick instead of typing grams.
      properties:
        name: { type: string, example: "тарілка" }
        grams: { type: number, example: 350 }
        is_default: { type: boolean }

    Food:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [product, dish]
          description: Packaged branded goods versus home dishes and raw ingredients.
        name: { type: string, example: "Куряче філе, варене" }
        brand: { type: string }
        barcode: { type: string }
        state:
          type: string
          enum: [raw, cooked, as_sold]
          description: Which preparation the values describe. Shown in the UI.
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        package_g: { type: number, nullable: true }
        source_id: { type: string, example: "curated" }
        source_url: { type: string }
        created_by_user_id:
          type: integer
          format: int64
          description: The user who contributed the entry, when one did.
        portions:
          type: array
          items: { $ref: '#/components/schemas/Portion' }

    Candidate:
      type: object
      properties:
        food: { $ref: '#/components/schemas/Food' }
        score:
          type: number
          description: Trigram similarity, 0 to 1.
        bonus:
          type: number
          description: |
            History affinity added to the score when ranking, 0 to 0.25. Zero
            for foods the caller has never logged.

    FrequentFood:
      type: object
      properties:
        food: { $ref: '#/components/schemas/Food' }
        logs:
          type: integer
          description: How many entries the caller has logged for this food, ever.
        last_logged:
          type: string
          format: date-time

    LogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        food_id:
          type: integer
          format: int64
          nullable: true
          description: Null for an inline entry, which has no catalogue row.
        food_name: { type: string }
        grams: { type: number }
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        logged_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogueEntryRequest:
      type: object
      required: [food_id]
      properties:
        food_id: { type: integer, format: int64 }
        grams: { type: number, maximum: 5000 }
        portion_name: { type: string, example: "тарілка" }
        portion_qty: { type: number, maximum: 50 }
        logged_at: { type: string, format: date-time, description: When the food was eaten. Defaults to now. }

    InlineEntryRequest:
      type: object
      required: [name, grams, nutrition]
      properties:
        name: { type: string, maxLength: 200, example: "мамина запіканка" }
        grams: { type: number, maximum: 5000 }
        nutrition:
          type: object
          description: Absolute values for the given grams. Macros default to zero.
          required: [kcal]
          properties:
            kcal: { type: number, minimum: 0 }
            protein: { type: number, minimum: 0 }
            fat: { type: number, minimum: 0 }
            carbs: { type: number, minimum: 0 }
        logged_at: { type: string, format: date-time, description: When the food was eaten. Defaults to now. }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254, description: Matched case-insensitively. }
        password:
          type: string
          minLength: 8
          description: At most 72 bytes; bcrypt ignores anything past that, so longer is rejected.

    Session:
      type: object
      properties:
        token: { type: string, description: Shown once; only its hash is stored. }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, description: Absent for users created without credentials. }
        sex: { type: string, enum: [male, female] }
        age: { type: integer }
        height_cm: { type: integer }
        weight_kg: { type: number }
        goal_weight_kg: { type: number }
        activity_level:
          type: string
          enum: [sedentary, light, moderate, high, very_high]
        kcal_target: { type: integer }
        protein_target_g: { type: integer }
        timezone: { type: string }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: healthCheck
      security: []
      responses:
        "204": { description: Serving }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text format
          content:
            text/plain: {}

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        "201":
          description: Account created, with its first token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409":
          description: The email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Get a fresh token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        "200":
          description: A new token; earlier ones stay valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401":
          description: Unknown email or wrong password, indistinguishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/RateLimited' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the calling token
      operationId: logout
      responses:
        "204": { description: Revoked }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/me:
    get:
      tags: [user]
      summary: Current user
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [user]
      summary: Update targets and weight
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kcal_target: { type: integer, minimum: 800, maximum: 6000 }
                protein_target_g: { type: integer, minimum: 20, maximum: 400 }
                weight_kg: { type: number, minimum: 30, maximum: 300 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/foods:
    get:
      tags: [food]
      summary: Search the catalogue
      operationId: searchFoods
      description: |
        Matches `q` against the alias table and returns ranked rows, best first,
        with the caller's history bonus applied. The call has no side effects,
        and a query that matches nothing returns an empty array.
      parameters:
        - name: q
          in: query
          description: Free text, normalized server-side.
          schema: { type: string, example: "молоко" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: locale
          in: query
          required: false
          schema: { type: string, default: uk, example: uk }
          description: |
            Biases ranking toward a market; it never filters, so a row from
            another market still appears, only lower. Defaults to Ukrainian.
            Rows from Ukrainian-market sources rank highest, then rows whose
            name carries і, ї, є or ґ, which separates Ukrainian products from
            the Russian and Bulgarian ones that share the Cyrillic script.
            Any value other than `uk` currently applies no bias.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidate' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/foods/frequent:
    get:
      tags: [food]
      summary: The caller's most-logged foods
      operationId: frequentFoods
      description: |
        Catalogue foods ranked by how many times the caller has ever logged
        them, with no time window and no recency decay; ties go to the most
        recently logged. Entries logged inline, without a catalogue id, are not
        counted.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FrequentFood' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/foods/{id}:
    get:
      tags: [food]
      summary: One catalogue entry
      operationId: getFood
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/barcode/{code}:
    get:
      tags: [food]
      summary: Look up a product by barcode
      operationId: getFoodByBarcode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: "04820001316384" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/foods:
    post:
      tags: [food]
      summary: Contribute a food
      operationId: createFood
      description: |
        Adds an entry to the shared catalogue, visible to every caller. The
        caller is recorded as `created_by_user_id`; that is attribution, not
        ownership. If portions are given and none is marked default, the first
        one is the default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kcal]
              properties:
                name: { type: string, maxLength: 200 }
                kcal: { type: number, maximum: 900 }
                protein: { type: number, maximum: 100 }
                fat: { type: number, maximum: 100 }
                carbs: { type: number, maximum: 100 }
                portions:
                  type: array
                  maxItems: 5
                  description: At most one may have `is_default` set.
                  items:
                    type: object
                    required: [name, grams]
                    properties:
                      name: { type: string, maxLength: 50 }
                      grams: { type: number, exclusiveMinimum: 0, maximum: 5000 }
                      is_default: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        "400": { $ref: '#/components/responses/BadRequest' }

  /v1/entries:
    get:
      tags: [day]
      summary: List logged entries
      operationId: listEntries
      description: |
        A flat array ordered by `logged_at` descending, filtered on `logged_at`. No totals or targets are
        computed; callers sum what they need.
      parameters:
        - name: from
          in: query
          description: |
            Start of the range, inclusive. A full RFC3339 timestamp, or a bare
            date meaning that day's midnight in UTC. Defaults to today (UTC).
          schema: { type: string }
        - name: to
          in: query
          description: |
            End of the range, inclusive. A full RFC3339 timestamp, or a bare
            date meaning the end of that UTC day. Defaults to today (UTC).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogEntry' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [day]
      summary: Log a food
      operationId: createEntry
      description: |
        Logging never requires a lookup. Send either a catalogue `food_id`
        with grams or a count of a named portion, or an inline `name` with
        `grams` and `nutrition`, which creates no catalogue row. Exactly one of
        `food_id` and `name` is required. Nutrition is snapshotted at save
        time, so a later catalogue correction never rewrites a day already
        logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CatalogueEntryRequest'
                - $ref: '#/components/schemas/InlineEntryRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogEntry' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/entries/{id}:
    patch:
      tags: [day]
      summary: Change an entry's amount
      operationId: updateEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grams]
              properties:
                grams: { type: number, maximum: 5000 }
      responses:
        "204": { description: Updated }
        "409": { $ref: '#/components/responses/DayLocked' }
    delete:
      tags: [day]
      summary: Delete an entry
      operationId: deleteEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: '#/components/responses/DayLocked' }

  /mcp:
    post:
      tags: [mcp]
      summary: Model Context Protocol endpoint
      operationId: mcp
      description: |
        Speaks MCP over stateless streamable HTTP (JSON-RPC in the POST body;
        GET and DELETE return 405) and needs the same bearer token as the REST
        routes. The caller is the token's owner; no tool takes a user id.
        The tools are `search_foods`, `get_food`, `log_entry`, `list_entries`,
        `frequent_foods` and `create_food`; connect with an MCP client and call
        `tools/list` for their descriptions and schemas.
      responses:
        "200": { description: A JSON-RPC response }
        "401": { $ref: '#/components/responses/Unauthorized' }
