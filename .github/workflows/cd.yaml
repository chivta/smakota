name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      calbot: ${{ steps.changes.outputs.calbot }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # Diffing against the deployed tag, not the head commit's parent, still
      # builds when a push ends in a docs-only commit or the tag is a placeholder.
      - id: changes
        name: Detect image changes since the deployed tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deployed="$(sed -nE 's|^ +newTag: *||p' k8s/kustomization.yaml)"
          if ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            echo "calbot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$deployed" "$SHA" | grep -Eq '^(Dockerfile|\.dockerignore|go\.(mod|sum)|cmd/|internal/)'; then
            echo "calbot=true" >> "$GITHUB_OUTPUT"
          else
            echo "calbot=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.calbot == 'true'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/chivta/smakota
    steps:
      # main rather than the detached SHA, so the deploy commit has a branch to land on.
      - uses: actions/checkout@v6
        with:
          ref: main
      # A newer push to main means this run is stale and must not overwrite its deploy.
      - name: Guard against stale runs
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push calbot
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pin the new tag into the manifests
        run: |
          sed -i -E "s|^( +newTag: ).*|\1$SHA|" k8s/kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: calbot $SHA"
          git push origin main
