name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      calbot: ${{ steps.changes.outputs.calbot }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: changes
        name: Detect image changes
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          files="$(git diff-tree --root --no-commit-id --name-only -r -m "$SHA" | sort -u)"
          if grep -Eq '^(Dockerfile|\.dockerignore|go\.(mod|sum)|cmd/|internal/)' <<<"$files"; then
            echo "calbot=true" >> "$GITHUB_OUTPUT"
          else
            echo "calbot=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.calbot == 'true'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/arvlas/calbot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # The Kubernetes manifests will consume the SHA-tagged image pushed here.
      - name: Build and push calbot
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
