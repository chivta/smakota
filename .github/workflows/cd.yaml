name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      calbot: ${{ steps.changes.outputs.calbot }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: changes
        name: Detect image changes
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          files="$(git diff-tree --root --no-commit-id --name-only -r -m "$SHA" | sort -u)"
          if grep -Eq '^(Dockerfile|\.dockerignore|go\.(mod|sum)|cmd/|internal/|data/)' <<<"$files"; then
            echo "calbot=true" >> "$GITHUB_OUTPUT"
          else
            echo "calbot=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.calbot == 'true'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/arvlas/calbot
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push calbot
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Compose image tags
        run: >-
          sed -i -E
          "s|(image: ghcr.io/arvlas/calbot:)[0-9a-f]{40}|\1${SHA}|g"
          compose.yaml
      - name: Commit deployment manifest
        run: |
          if git diff --quiet -- compose.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.yaml
          git commit -m "deploy: calbot ${SHA}"
          git push origin HEAD:main
